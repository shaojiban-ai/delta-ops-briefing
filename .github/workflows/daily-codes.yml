name: 每日密码抓取 / Daily Door Codes

on:
  schedule:
    # GitHub Actions 使用 UTC。源约在北京时间 9-10 点更新（=UTC 01-02 点），
    # 源偶尔滞后，故多跑几次以抓到当天数据。
    - cron: "0 2 * * *"   # 北京 10:00
    - cron: "30 3 * * *"  # 北京 11:30
    - cron: "0 6 * * *"   # 北京 14:00
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

concurrency:
  group: daily-codes
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取每日密码
        run: node scripts/crawl-daily-codes.mjs

      - name: 提交更新（仅当有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/data/daily-codes.json)" ]; then
            git add public/data/daily-codes.json
            git commit -m "chore(codes): 更新每日密码 $(date -u +%Y-%m-%d)"
            git push
          else
            echo "密码无变化，跳过提交。"
          fi
